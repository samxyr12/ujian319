      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk UjianOnline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UjianOnline-apk
          path: UjianOnline.apk

      - name: Buat Release (link unduh langsung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" UjianOnline.apk --repo "$GITHUB_REPOSITORY" --title "Ujian Online build ${{ github.run_number }}" --notes "APK debug Ujian Online"
